services:
  # ---------------------------------------------------------------------------
  # Databases & cache
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: tracesync-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tracesync}
      MYSQL_USER: ${MYSQL_USER:-tracesync}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tracesync
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tracesync-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - tracesync
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Laravel (control plane)
  # ---------------------------------------------------------------------------
  laravel:
    build:
      context: ./laravel
      dockerfile: Dockerfile
    container_name: tracesync-laravel
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-tracesync}
      DB_USERNAME: ${MYSQL_USER:-tracesync}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      RAZORPAY_KEY: ${RAZORPAY_KEY:-}
      RAZORPAY_SECRET: ${RAZORPAY_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_CURRENCY: ${RAZORPAY_CURRENCY:-INR}
      RAZORPAY_SUBSCRIPTION_TOTAL_COUNT: ${RAZORPAY_SUBSCRIPTION_TOTAL_COUNT:-12}
      RAZORPAY_CUSTOMER_NOTIFY: ${RAZORPAY_CUSTOMER_NOTIFY:-1}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-TraceSync AI}
    volumes:
      - ./laravel:/var/www/html
    ports:
      - "${LARAVEL_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tracesync
    command: >
      sh -c "php artisan serve --host=0.0.0.0 --port=8080"

  # ---------------------------------------------------------------------------
  # NestJS (ingest firehose)
  # ---------------------------------------------------------------------------
  nestjs:
    build:
      context: ./nestjs
      dockerfile: Dockerfile
    container_name: tracesync-nestjs
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3030
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-tracesync}
      DB_USERNAME: ${MYSQL_USER:-tracesync}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      TYPEORM_SYNC: ${TYPEORM_SYNC:-true}
      TYPEORM_LOGGING: ${TYPEORM_LOGGING:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    volumes:
      - ./nestjs:/app
      - /app/node_modules
    ports:
      - "${NESTJS_PORT:-3030}:3030"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tracesync
    command: >
      sh -c "npm run start:dev"

  # ---------------------------------------------------------------------------
  # React (operator dashboard)
  # ---------------------------------------------------------------------------
  react:
    build:
      context: ./react
      dockerfile: Dockerfile
    container_name: tracesync-react
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_NESTJS_URL: ${VITE_NESTJS_URL:-http://localhost:3030}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./react:/app
      - /app/node_modules
    ports:
      - "${REACT_PORT:-5173}:5173"
    depends_on:
      - laravel
      - nestjs
    networks:
      - tracesync
    command: >
      sh -c "npm run dev -- --host 0.0.0.0 --port 5173"

networks:
  tracesync:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
